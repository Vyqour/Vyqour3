name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vyqour_test?sslmode=disable
      JWT_ACCESS_SECRET: ci_test_jwt_access_secret_32chars_long
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_32chars_long
      QIKINK_ENABLED: "true"
      QIKINK_SANDBOX: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      # Unit tests (src/**/*.spec.ts) use mocked Prisma and never connect to
      # PostgreSQL, so this job intentionally has no database service.
      - name: Run API unit tests (no database required)
        run: npm run test:unit --workspace=@vyqour/api

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vyqour_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vyqour_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vyqour_test?sslmode=disable
      JWT_ACCESS_SECRET: ci_test_jwt_access_secret_32chars_long
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_32chars_long
      QIKINK_ENABLED: "true"
      QIKINK_SANDBOX: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Push Prisma schema to test database
        run: cd apps/api && npx prisma db push

      # Runs every src/**/*.integration-spec.ts (checkout, Qikink concurrency,
      # stock concurrency) serially against the PostgreSQL service.
      - name: Run PostgreSQL integration tests
        run: npm run test:integration --workspace=@vyqour/api

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build API
        run: npm run build:api
