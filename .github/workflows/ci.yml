name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vyqour_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vyqour_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vyqour_test?sslmode=disable
      JWT_ACCESS_SECRET: ci_test_jwt_access_secret_32chars_long
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_32chars_long
      QIKINK_ENABLED: "true"
      QIKINK_SANDBOX: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Push Prisma schema to test database
        run: cd apps/api && npx prisma db push

      - name: Run Phase 8 Unit & PostgreSQL Concurrency Integration Tests
        run: |
          cd apps/api && npx jest --testRegex=".*\\.(spec|integration-spec)\\.ts$" src/modules/qikink/qikink.service.spec.ts src/modules/qikink/qikink-order.mapper.spec.ts src/modules/qikink/qikink-concurrency.integration-spec.ts src/modules/payments/payments.service.spec.ts

      - name: Build API
        run: npm run build:api
